[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoalpha-research"
version = "0.5.0"
description = "Auditable LLM-assisted cross-sectional factor research platform."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Jiang Jingzhe", email = "contact@jiangjingzhe.com" },
]
keywords = [
  "a-shares",
  "factor-research",
  "large-language-models",
  "multi-agent",
  "portfolio-optimization",
  "quantitative-finance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<24",
  "scipy>=1.14,<2",
  "tushare>=1.4,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/khakhasshi/MultiFactorAshare"
Documentation = "https://github.com/khakhasshi/MultiFactorAshare#readme"
Issues = "https://github.com/khakhasshi/MultiFactorAshare/issues"
Source = "https://github.com/khakhasshi/MultiFactorAshare/tree/main/AutoAlpha"

[project.scripts]
autoalpha = "autoalpha.cli:main"
autoalpha-service = "autoalpha.service.app:main"
autoalpha-batch-service = "autoalpha.service.batch_app:main"
autoalpha-realistic-batch-service = "autoalpha.service.realistic_batch_app:main"
autocombine-service = "autoalpha.service.autocombine_app:main"
quantcombine-service = "autoalpha.service.quantcombine_app:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoalpha"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/config",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/evaluation.md",
  "/IMPLEMENTATION_STATUS.md",
  "/INSTITUTIONAL_IMPROVEMENT_GOALS.md",
  "/program.md",
  "/Dockerfile",
  "/start-services.sh",
  "/stop-services.sh",
  "/.env.example",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
