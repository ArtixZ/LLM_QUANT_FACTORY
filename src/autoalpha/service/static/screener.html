<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoAlpha 选股器</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="identity">
      <h1>AutoAlpha 因子选股器</h1>
      <p id="screenerSummary">读取可用研究因子与数据范围</p>
    </div>
    <div class="header-actions">
      <nav class="app-nav" aria-label="研究工作台">
        <a href="/"><i data-lucide="activity"></i>自动研究</a>
        <a href="/research-tasks"><i data-lucide="list-tree"></i>任务总表</a>
        <a href="/llm-team"><i data-lucide="brain-circuit"></i>LLM 团队</a>
        <a href="/factors"><i data-lucide="library"></i>因子库</a>
        <a class="active" href="/screener"><i data-lucide="list-filter"></i>选股器</a>
        <a href="/paper-trading"><i data-lucide="wallet-cards"></i>模拟交易</a>
        <a href="/backtest"><i data-lucide="chart-no-axes-combined"></i>手动回测</a>
        <a href="/data"><i data-lucide="database-zap"></i>数据中心</a>
      </nav>
      <span class="state-pill small">EOD SCREEN</span>
    </div>
  </header>

  <main class="screener-shell">
    <aside class="panel screener-config">
      <div class="panel-header">
        <div><h2>选股设置</h2><p id="screenerDataRange">--</p></div>
      </div>
      <form id="screenerForm">
        <div class="screener-fields">
          <label>信号日期<input id="asOfDate" type="date" required></label>
          <div class="field-pair">
            <label>候选数量<input id="selectionCount" type="number" min="1" max="500" step="1" value="30" required></label>
            <label>选股方向
              <select id="selectionSide">
                <option value="TOP">综合分最高</option>
                <option value="BOTTOM">综合分最低</option>
              </select>
            </label>
          </div>
        </div>
        <div class="factor-picker-header"><h3>选择因子</h3><span id="selectedCount">0 / 12</span></div>
        <label class="search-field compact"><span><i data-lucide="search"></i><input id="factorSearch" type="search" placeholder="搜索名称、类别或 ID"></span></label>
        <div class="screener-factor-list" id="factorPicker"></div>
        <div class="screener-weights" id="selectedFactors" hidden>
          <div class="factor-picker-header"><h3>组合权重</h3><button id="equalWeights" class="text-button" type="button">等权</button></div>
          <div id="weightEditor"></div>
        </div>
        <button class="button primary screener-run" type="submit" id="runScreener"><i data-lucide="scan-search"></i>快速选股</button>
      </form>
      <div class="isolation-note"><i data-lucide="shield"></i><span>只生成收盘后选股快照，不改变组合、记忆或评估预算</span></div>
    </aside>

    <section class="panel screener-results">
      <div class="panel-header">
        <div><h2>候选股票</h2><p id="resultSummary">选择因子后运行</p></div>
        <span class="state-pill small" id="resultStatus">READY</span>
      </div>
      <div class="screener-kpis">
        <div><span>实际信号日</span><strong id="signalDate">--</strong></div>
        <div><span>有效因子</span><strong id="evaluatedFactors">--</strong></div>
        <div><span>股票池</span><strong id="universeSize">--</strong></div>
        <div><span>候选数量</span><strong id="resultCount">--</strong></div>
      </div>
      <div class="screener-note" id="screenNote">信号在当日收盘后形成；此页面不生成可交易订单。</div>
      <div class="screened-factor-summary" id="factorSummary"></div>
      <div class="screener-table-wrap">
        <table class="screener-table">
          <thead id="resultTableHead"></thead>
          <tbody id="resultTableBody"></tbody>
        </table>
        <div class="empty-table" id="resultEmpty">暂无选股结果</div>
      </div>
      <div class="screening-warnings" id="screenWarnings" hidden></div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/static/screener.js"></script>
</body>
</html>
