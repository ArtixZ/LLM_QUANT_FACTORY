[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multifactor-ashare"
version = "0.1.0"
description = "Data and research tooling for A-share cross-sectional multi-factor strategies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3,<2",
]

[project.scripts]
mf-data = "multifactor_ashare.data:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multifactor_ashare"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
