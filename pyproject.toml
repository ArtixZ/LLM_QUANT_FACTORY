[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoalpha-research"
version = "0.5.0"
description = "Auditable LLM-assisted cross-sectional factor research platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=18,<24",
  "scipy>=1.14,<2",
  "tushare>=1.4,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
autoalpha = "autoalpha.cli:main"
autoalpha-service = "autoalpha.service.app:main"
autoalpha-batch-service = "autoalpha.service.batch_app:main"
autoalpha-realistic-batch-service = "autoalpha.service.realistic_batch_app:main"
autocombine-service = "autoalpha.service.autocombine_app:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoalpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
