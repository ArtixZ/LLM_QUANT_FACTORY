[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multifactor-us"
version = "0.1.0"
description = "Data and research tooling for US equity cross-sectional multi-factor strategies."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Jiang Jingzhe", email = "contact@jiangjingzhe.com" },
]
keywords = [
  "us-equities",
  "factor-research",
  "portfolio-optimization",
  "quantitative-finance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "duckdb>=1.3,<2",
]

[project.urls]
Homepage = "https://github.com/ArtixZ/LLM_QUANT_FACTORY"
Documentation = "https://github.com/ArtixZ/LLM_QUANT_FACTORY#readme"
Issues = "https://github.com/ArtixZ/LLM_QUANT_FACTORY/issues"
Source = "https://github.com/ArtixZ/LLM_QUANT_FACTORY"

[project.scripts]
mf-us = "multifactor_us.data:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multifactor_us"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/README.md",
  "/README_EN.md",
  "/AGENTS.md",
  "/LICENSE",
  "/NOTICE",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/ROADMAP.md",
  "/CITATION.cff",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
